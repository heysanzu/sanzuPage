<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- Tells search engines the new URL is the main one -->
    <link rel="canonical" href="https://heysanzu.github.io/sanzu/">
    
    <!-- Method 1: Instant Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=https://heysanzu.github.io/sanzu/">
  </head>
  <body>
    <p>This page has moved. You are being redirected to 
       <a href="https://heysanzu.github.io/sanzu/">https://heysanzu.github.io/sanzu/</a>
    </p>
    
    <!-- Method 2: JavaScript Fallback -->
    <script>
      window.location.href = "https://heysanzu.github.io/sanzu/";
    </script>
  </body>
</html>
